name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege (SEC-17); no job here needs write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs, not tags (SEC-17).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      # --- ENG-19 pipeline order: install -> typecheck -> lint -> tests -> evals -> build -> e2e -> lighthouse.
      # Supply-chain + secret/copy hygiene run first (fail fast); they do not reorder the stages above.
      - name: Install (npm ci)
        run: npm ci

      - name: Audit dependencies (SEC-16)
        run: npm audit --audit-level=high

      - name: Secret-shape hygiene (SEC-01)
        run: npm run check:secrets

      - name: Em-dash hygiene (DS-14)
        run: npm run check:em-dash

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Unit + integration tests
        run: npm test

      - name: Retrieval evals
        run: echo "stub step (P4.2, EVAL-06). Retrieval eval suite is wired here."

      - name: Build
        # `/` and `/evals` are static (PERF-02), so `next build` prerenders them and
        # reads the corpus summary (RAG-21); DATABASE_URL is the real secret, as in
        # the e2e/Lighthouse steps. No paid APIs run at build (route handlers aren't
        # prerendered; env.ts is boot-parsed, ENG-06), so the model/redis keys stay
        # creds-free placeholders and SEC-01's grep stays clean.
        env:
          ANTHROPIC_API_KEY: sk-ci
          OPENAI_API_KEY: sk-ci
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTASH_REDIS_REST_URL: https://ci.example.com
          UPSTASH_REDIS_REST_TOKEN: ci
          PORTFOLIO_URL: https://ci.example.com
        run: npm run build

      - name: Payload budgets (PERF-03)
        # Asserts performance.md §2 from the build output: absolute first-load JS
        # per route + the ≤30 KB app-delta, plus fonts/CSS. Coupled to the build
        # stage (PERF-03: a breach fails the build); reads .next, no server or APIs.
        run: npm run check:payload

      - name: Browser tests + axe
        # Playwright drives Chromium (only; cross-engine covered by manual
        # Safari/VoiceOver at P7.4/P8.3). /api/ask is intercepted with canned SSE
        # (ENG-17: zero model spend), so the model keys are placeholders; the
        # landing SSR reads the corpus, so DATABASE_URL is the real secret.
        env:
          ANTHROPIC_API_KEY: sk-ci
          OPENAI_API_KEY: sk-ci
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTASH_REDIS_REST_URL: https://ci.example.com
          UPSTASH_REDIS_REST_TOKEN: ci
          PORTFOLIO_URL: https://ci.example.com
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Lighthouse CI
        # PERF-01 page budgets (performance.md §1) via .lighthouserc.json: median of
        # 3 runs per route on the prod build, mobile-throttled. Metric -> audit map:
        # LCP/CLS -> same-named audits; TTFB -> server-response-time; INP (a field
        # metric Lighthouse lab cannot measure) -> total-blocking-time, its standard
        # lab proxy at the same 200 ms bar. Same env as e2e: DATABASE_URL is the real
        # secret (both routes SSR from the corpus), model/redis keys are placeholders.
        env:
          ANTHROPIC_API_KEY: sk-ci
          OPENAI_API_KEY: sk-ci
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTASH_REDIS_REST_URL: https://ci.example.com
          UPSTASH_REDIS_REST_TOKEN: ci
          PORTFOLIO_URL: https://ci.example.com
        run: npx lhci autorun

      - name: Upload Lighthouse report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-report
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 7
